services:
  - type: web
    name: srrhh-api
    runtime: node
    region: oregon
    branch: deploy
    rootDir: .
    buildCommand: npm install -g pnpm@9.15.0 && pnpm install --no-frozen-lockfile && cd packages/types && pnpm build && cd ../.. && cd apps/api && pnpm build
    startCommand: node apps/api/dist/app.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false          # se carga manualmente en el dashboard de Render
      - key: JWT_SECRET
        generateValue: true  # Render genera un valor aleatorio seguro
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: PYTHON_SERVICE_URL
        value: https://placeholder.internal  # reemplazar cuando exista el servicio Python
      - key: CORS_ORIGINS
        sync: false          # URL del frontend en Vercel — se carga manualmente
      - key: LOG_LEVEL
        value: info
