# SPA fallback: react-router-dom (createBrowserRouter) maneja el ruteo del
# lado del cliente — cualquier ruta que no matchee un archivo estático real
# tiene que devolver index.html para que React Router la resuelva, si no
# nginx tira 404 nativo en cualquier refresh que no sea "/".
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash en el nombre (Vite) — cache largo, son inmutables.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
